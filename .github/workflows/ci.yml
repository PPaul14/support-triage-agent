name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: sentence-transformers pulls torch in, and the default Linux
          # wheel brings several GB of CUDA libraries that no test uses.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run tests
        # No Ollama server exists here, so the tests that need one report as skipped.
        run: python -m pytest -v -rs
